<div class="login-card">
    <!-- ngSubmit é uma função do angular que permite rodar um método ao enviar um formulário -->
    <h3>Sistema de Almoxarifado</h3>
    <form (ngSubmit)="entrar()" #loginForm="ngForm">
        <!-- ngForm associa elementos do formulário a atributos do TypeScript -->
        <label for="">Login</label>
        <input type="text" name="login" [(ngModel)]="credenciais.login" required>
        <br>
        <label for="">Senha</label>
        <input type="password" name="senha" [(ngModel)]="credenciais.senha" required>
        <!-- ngModel faz binding do valor do input -->
        <br>
        <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
    </form>
</div>
